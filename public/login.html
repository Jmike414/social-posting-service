<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Social Console — Sign in</title>
  <style>
    :root { --bg:#0f1115; --card:#181b22; --fg:#e8eaed; --muted:#9aa0aa; --accent:#3b82f6; --err:#ef4444; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg);
           min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
    .card { background:var(--card); border-radius:16px; padding:28px 22px; width:100%; max-width:380px; box-shadow:0 10px 40px rgba(0,0,0,.4); }
    h1 { font-size:20px; margin:0 0 4px; }
    p { color:var(--muted); margin:0 0 20px; font-size:14px; }
    label { display:block; font-size:13px; color:var(--muted); margin-bottom:6px; }
    input { width:100%; padding:14px; font-size:16px; border-radius:10px; border:1px solid #2a2f3a; background:#0d0f14; color:var(--fg); }
    button { width:100%; margin-top:16px; padding:14px; font-size:16px; font-weight:600; border:0; border-radius:10px; background:var(--accent); color:#fff; }
    button:active { transform:translateY(1px); }
    .err { color:var(--err); font-size:13px; margin-top:12px; min-height:18px; }
  </style>
</head>
<body>
  <form class="card" id="f">
    <h1>Social Console</h1>
    <p>Operator sign-in</p>
    <label for="pw">Password</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autofocus />
    <button type="submit">Sign in</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      const err = document.getElementById('err');
      err.textContent = '';
      const r = await fetch('/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: document.getElementById('pw').value }),
      });
      if (r.ok) { window.location.href = '/'; }
      else { const j = await r.json().catch(() => ({})); err.textContent = j.error || 'Sign-in failed'; }
    });
  </script>
</body>
</html>
